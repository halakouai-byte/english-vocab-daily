# English Vocabulary Daily — watchdog: catch a missed scheduled post.
#
# GitHub cron is best-effort: a 07:15/17:15 event can be delayed for hours
# or dropped entirely. Observed: 2026-11-20 the 17:15 run started ~5h48m
# late; 2026-11-21 the 07:15 run was NEVER created (no run record at all)
# and the morning word was only posted after a manual dispatch. This
# workflow runs every hour and dispatches post.yml with the missing kind
# when a slot is overdue, so a miss is caught within ~1-3 hours.
#
# Safe by design:
# - post.py dedupes by SHA-256 of the rendered message, so if the late
#   scheduled run arrives after the watchdog, it only skips — no duplicate.
# - The "post" concurrency group serialises runs (cancel-in-progress: false).
# - The watchdog never dispatches while a post.yml run is already queued
#   or in progress (checked via the API first).
# - A workflow_dispatch triggered by GITHUB_TOKEN does execute (the
#   documented exception to the "token-triggered events don't trigger
#   workflows" rule), so no PAT is needed.
name: Watchdog — catch missed posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check state and dispatch the missing post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          # WATCHDOG_BASE is for local testing only (point it at a copy of
          # the repo); in Actions it defaults to the checkout root.
          BASE = Path(os.environ.get("WATCHDOG_BASE", ".")).resolve()
          REPO = os.environ.get("GITHUB_REPOSITORY", "halakouai-byte/english-vocab-daily")
          TOKEN = os.environ.get("GH_TOKEN", "")

          now = datetime.now(timezone.utc)
          today = now.date().isoformat()
          lessons = json.loads((BASE / "data" / "lessons.json").read_text())
          index = now.timetuple().tm_yday % len(lessons)
          state = json.loads((BASE / "data" / "state.json").read_text())
          last_date = state.get("last_date", "")
          last_index = state.get("last_index", -1)
          last_kind = state.get("last_kind", "")

          kind = None
          if last_date != today:
              # Nothing posted today at all. Morning slot (07:15 UTC) is
              # overdue once it is 10:00 UTC — dispatch the word.
              if now.hour >= 10:
                  kind = "word"
          elif last_index == index and last_kind == "word":
              # Word posted, quiz missing. Evening slot (17:15 UTC) is
              # overdue once it is 19:00 UTC — dispatch the quiz.
              if now.hour >= 19:
                  kind = "quiz"

          if kind is None:
              print(f"OK — nothing missing (last_date={last_date} last_index={last_index} last_kind={last_kind!r} now={now.isoformat()})")
              raise SystemExit(0)

          # Don't dispatch while a post.yml run is already queued/running;
          # the scheduled run may just be late.
          req = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}/actions/workflows/post.yml/runs?status=queued&status=in_progress&per_page=5",
              headers={"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              runs = json.loads(resp.read())["workflow_runs"]
          if runs:
              print(f"SKIP — post.yml already {sorted({r['status'] for r in runs})} (run ids: {[r['id'] for r in runs]}); will re-check next hour")
              raise SystemExit(0)

          body = json.dumps({"ref": "main", "inputs": {"kind": kind}}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}/actions/workflows/post.yml/dispatches",
              data=body,
              headers={"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"DISPATCHED post.yml kind={kind} (HTTP {resp.status}) at {now.isoformat()}")
          PY
