name: Post to Telegram

on:
  schedule:
    # 07:15 and 17:15 UTC every day — morning word + evening quiz.
    # Cron in GitHub Actions is best-effort: delays of hours happen and an
    # event can be dropped entirely (2026-11-21: the 07:15 run was never
    # created). watchdog.yml catches a missed slot.
    - cron: '15 7,17 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which post to send: word, quiz, or empty = decide by UTC hour'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_KIND: ${{ inputs.kind }}
        run: python scripts/post.py

      - name: Commit updated state
        # This commit is what keeps the repo active, so GitHub does not
        # disable the scheduled workflow after 60 days of inactivity.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update state $(date -u +%F)"
          git push
